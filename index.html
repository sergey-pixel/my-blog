<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт в разработке</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        .icon-container {
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        /* Анимированная иконка шестеренки */
        .gear {
            width: 80px;
            height: 80px;
            fill: #58a6ff;
            animation: spin 4s linear infinite;
        }

        h1 {
            font-size: 2.5rem;
            color: #f0f6fc;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Декоративная линия */
        .divider {
            width: 60px;
            height: 4px;
            background-color: #238636;
            margin: 0 auto 2rem auto;
            border-radius: 2px;
        }

        .footer {
            font-size: 0.9rem;
            color: #484f58;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Адаптивность для мобильных экранов */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 1rem;
            }
            .gear {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>
